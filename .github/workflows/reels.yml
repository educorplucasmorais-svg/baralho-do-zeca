# Reel diario: sai as 19h30, depois do carrossel das 16h, com a carta do carrossel do dia.
# Fica so na aba Reels (nao entra na grade do perfil).
name: Reel diario do Baralho do Zeca

on:
  schedule:
    - cron: "30 22 * * *"    # 22h30 UTC = 19h30 em Brasilia
  workflow_dispatch:          # botao "Run workflow" para publicar o Reel na hora

permissions:
  contents: write

concurrency:
  group: postar               # nunca roda ao mesmo tempo que o post das 16h
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/posts/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar o Reel do dia
        run: python postar.py reel
      - name: Guardar o registro do que saiu
        if: always()
        run: |
          git config user.name "postador-baralho"
          git config user.email "postador-baralho@users.noreply.github.com"
          git add publicados.json
          git commit -m "Reel publicado em $(date +%F)" || echo "nada novo"
          git pull --rebase
          git push
