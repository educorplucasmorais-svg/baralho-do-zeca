# Metricas do dia: as 21h coleta visualizacoes, alcance, compartilhamentos, salvamentos e
# tempo assistido de cada carrossel e Reel da ultima semana (metricas-posts.csv e metricas/resumo.json).
name: Metricas diarias do Baralho do Zeca

on:
  schedule:
    - cron: "0 0 * * *"      # 00h UTC = 21h em Brasilia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/posts/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar metricas dos posts
        run: python postar.py insights
      - name: Guardar as metricas
        if: always()
        run: |
          git config user.name "postador-baralho"
          git config user.email "postador-baralho@users.noreply.github.com"
          git add metricas-posts.csv metricas-conta.csv metricas/resumo.json metricas/publico.json
          git commit -m "Metricas de $(date +%F)" || echo "nada novo"
          git pull --rebase
          git push
